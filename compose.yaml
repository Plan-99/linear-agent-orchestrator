x-lao-build: &lao-build
  context: .
  dockerfile: Dockerfile
  args:
    LAO_UID: ${LAO_UID:-1000}
    LAO_GID: ${LAO_GID:-1000}
    CODEX_VERSION: ${CODEX_VERSION:-0.144.1}
    OMX_VERSION: ${OMX_VERSION:-0.20.0}
    CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.195}
    LAO_SOURCE_REVISION: ${LAO_SOURCE_REVISION:-unknown}

services:
  orchestrator:
    build: *lao-build
    image: ${LAO_IMAGE:-linear-agent-orchestrator:local}
    # Non-root: run as the host user so bind-mounted files are host-owned.
    user: "${LAO_UID:-1000}:${LAO_GID:-1000}"
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    working_dir: /workspace/project
    env_file:
      - path: .env
        required: false
    environment:
      # Fail closed: .env cannot enable a remote daemon; the opt-in override
      # replaces this only after scripts/compose.sh validates host Docker access.
      DOCKER_HOST: ""
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      STATE_DB_PATH: ${STATE_DB_PATH:-/workspace/data/state.sqlite3}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      LINEAR_OAUTH_CLIENT_ID: ${LINEAR_OAUTH_CLIENT_ID:-}
      LINEAR_OAUTH_CLIENT_SECRET: ${LINEAR_OAUTH_CLIENT_SECRET:-}
      LINEAR_TEAM_ID: ${LINEAR_TEAM_ID:-}
      # Only issues assigned to this user are polled. API-key mode may leave it
      # empty to use the viewer; OAuth app-actor mode requires a human user ID.
      LINEAR_ASSIGNEE_ID: ${LINEAR_ASSIGNEE_ID:-}
      LINEAR_PROJECT_NAME: ${LINEAR_PROJECT_NAME:-}
      LINEAR_PROJECT_ID: ${LINEAR_PROJECT_ID:-}
      LINEAR_QUEUE_STATE_NAME: ${LINEAR_QUEUE_STATE_NAME:-Todo}
      LINEAR_IN_PROGRESS_STATE_NAME: ${LINEAR_IN_PROGRESS_STATE_NAME:-In Progress}
      LINEAR_DONE_STATE_NAME: ${LINEAR_DONE_STATE_NAME:-Done}
      LINEAR_ATTENTION_STATE_NAME: ${LINEAR_ATTENTION_STATE_NAME:-In Review}
      RUNNER_COMMAND_TEMPLATE: ${RUNNER_COMMAND_TEMPLATE:-}
      # false disables one-shot and interactive backend execution deadlines.
      RUNNER_TIMEOUT_ENABLED: ${RUNNER_TIMEOUT_ENABLED:-true}
      RUNNER_TIMEOUT_SECONDS: ${RUNNER_TIMEOUT_SECONDS:-3600}
      # Interactive hard cap: idle-timeout resets never extend a run past this.
      RUNNER_MAX_LIFETIME_SECONDS: ${RUNNER_MAX_LIFETIME_SECONDS:-21600}
      RUNNER_WORK_DIR: ${RUNNER_WORK_DIR:-/workspace/work}
      RUNNER_ARTIFACTS_DIR: ${RUNNER_ARTIFACTS_DIR:-/workspace/artifacts}
      RUNNER_ALLOWED_ENV: ${RUNNER_ALLOWED_ENV:-}
      AGENT_BACKEND: ${AGENT_BACKEND:-omx}
      AGENT_MODEL: ${AGENT_MODEL:-}
      AGENT_EFFORT: ${AGENT_EFFORT:-}
      AGENT_PROJECT_DIR: ${AGENT_PROJECT_DIR:-/workspace/project}
      # Source worktrees are separate from runner scratch data. main prevents
      # new issues from inheriting the operator's currently checked-out branch.
      AGENT_WORKTREE_ROOT: ${AGENT_WORKTREE_ROOT:-/workspace/work/worktrees}
      AGENT_BASE_REF: ${AGENT_BASE_REF:-main}
      # Per-run git worktree isolation; runs commit to local lao/<issue>
      # branches (never pushed) and the base checkout stays clean.
      AGENT_WORKTREE_ISOLATION: ${AGENT_WORKTREE_ISOLATION:-true}
      # Interactive TUI conversation mode (requires the tmux console).
      AGENT_INTERACTIVE: ${AGENT_INTERACTIVE:-false}
      # Legacy behavior: close the interactive TUI as soon as result.json is valid.
      AGENT_INTERACTIVE_AUTOCLOSE: ${AGENT_INTERACTIVE_AUTOCLOSE:-false}
      # Concurrent issue workers in one daemon; >1 requires worktree isolation.
      MAX_PARALLEL_RUNS: ${MAX_PARALLEL_RUNS:-1}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      AGENT_SANDBOX: ${AGENT_SANDBOX:-workspace-write}
      AGENT_PERMISSION_MODE: ${AGENT_PERMISSION_MODE:-acceptEdits}
      # Docker is the security boundary; agent CLIs bypass permissions inside.
      AGENT_BYPASS_PERMISSIONS: ${AGENT_BYPASS_PERMISSIONS:-true}
      # Interactive agent console (tmux). The bootstrapped .env defaults to true
      # and scripts/daemon.sh supplies that resolved value. The auto fallback is
      # retained for direct Compose compatibility when no bootstrapped .env is
      # present. The tmux control socket stays container-private; only per-run
      # JSONL/output logs are bind-mounted.
      AGENT_CONSOLE: ${AGENT_CONSOLE:-auto}
      AGENT_CONSOLE_LOG_DIR: ${AGENT_CONSOLE_LOG_DIR:-/workspace/logs/console}
      # Explicit direct-input capability; false unless an adapter reads a PTY.
      AGENT_CONSOLE_DIRECT_INPUT: ${AGENT_CONSOLE_DIRECT_INPUT:-false}
      # Ephemeral container-only location; deliberately never bind-mounted.
      AGENT_CONSOLE_SOCKET_DIR: ${AGENT_CONSOLE_SOCKET_DIR:-/tmp/lao-console}
      HOME: /home/agent
      CODEX_HOME: /home/agent/.codex
    volumes:
      # Orchestrator-local runtime state (never issue-controlled paths).
      - ${LAO_RUNTIME_DIR:-./.runtime}/data:/workspace/data
      - ${LAO_RUNTIME_DIR:-./.runtime}/work:/workspace/work
      - ${LAO_RUNTIME_DIR:-./.runtime}/artifacts:/workspace/artifacts
      # Host-readable agent-console dir (per-run lifecycle JSONL + output.log),
      # mounted at AGENT_CONSOLE_LOG_DIR=/workspace/logs/console. This is the exact
      # directory the host resolver watches. AGENT_CONSOLE_HOST_LOG_DIR overrides
      # the host source. Container-private tmux socket/argv are NOT mounted.
      - ${AGENT_CONSOLE_HOST_LOG_DIR:-${LAO_RUNTIME_DIR:-./.runtime}/logs/console}:/workspace/logs/console
      # Dedicated persistent agent home with credential copies; never the live
      # host CLI homes. Seeded by scripts/bootstrap.sh.
      - ${LAO_RUNTIME_DIR:-./.runtime}/agent-home:/home/agent
      # Exactly one fixed, trusted repository per daemon. The base file has no
      # Docker socket; compose.docker-host.yaml is the explicit trust override.
      - ${LAO_PROJECT_DIR:-.}:/workspace/project
    command: ["startup-check", "--allow-missing-secrets"]

  tests:
    build: *lao-build
    image: ${LAO_IMAGE:-linear-agent-orchestrator:local}
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      APP_ENV: test
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      STATE_DB_PATH: /tmp/lao-tests/state.sqlite3
      AGENT_CONSOLE: "false"
      AGENT_CONSOLE_LOG_DIR: /tmp/lao-tests/logs/console
      AGENT_CONSOLE_DIRECT_INPUT: "false"
      LINEAR_API_KEY: ""
      LINEAR_OAUTH_CLIENT_ID: ""
      LINEAR_OAUTH_CLIENT_SECRET: ""
      LINEAR_TEAM_ID: ""
      LINEAR_ASSIGNEE_ID: ""
      LINEAR_PROJECT_NAME: ""
      LINEAR_PROJECT_ID: ""
      LINEAR_QUEUE_STATE_NAME: Todo
      LINEAR_IN_PROGRESS_STATE_NAME: In Progress
      LINEAR_DONE_STATE_NAME: Done
      LINEAR_ATTENTION_STATE_NAME: In Review
      RUNNER_COMMAND_TEMPLATE: ""
      RUNNER_WORK_DIR: /tmp/lao-tests/work
      RUNNER_ARTIFACTS_DIR: /tmp/lao-tests/artifacts
      RUNNER_ALLOWED_ENV: ""
    command: ["pytest", "-q"]
    entrypoint: []
