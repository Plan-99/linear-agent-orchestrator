[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linear-agent-orchestrator"
version = "0.1.0"
description = "Polling-only Linear agent orchestrator scaffold"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Linear Agent Orchestrator Maintainers" }]
license = { text = "UNLICENSED" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.2"]

[project.scripts]
linear-agent-orchestrator = "linear_agent_orchestrator.cli:main"
lao = "linear_agent_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
